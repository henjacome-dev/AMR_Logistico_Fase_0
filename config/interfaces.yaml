# Interfaces centrales: parte exigida por el enunciado y parte propuesta.
# Este archivo no es automáticamente un archivo de parámetros ROS 2.
robot:
  model: waffle_pi
  max_linear_mps: 0.20
  max_angular_radps: 1.5
  inflated_radius_m: 0.21
  map_resolution_m: 0.05
  angular_positive_direction: left_ccw
sensors:
  lidar_sector_width_deg: 15
  sectors_deg: {frontal: 0, izquierda: 45, derecha: -45}
  range_max_m: 2.0
  noise_sigma_m: 0.01
specified_topics:
  scan: {name: /scan, type: sensor_msgs/msg/LaserScan}
  frontal: {name: /rango_frontal, type: sensor_msgs/msg/Range}
  izquierda: {name: /rango_izq, type: sensor_msgs/msg/Range}
  derecha: {name: /rango_der, type: sensor_msgs/msg/Range}
  odometria: {name: /odom, type: nav_msgs/msg/Odometry}
  camera: {name: /camera/image_raw, type: sensor_msgs/msg/Image}
  cmd_vel: {name: /cmd_vel, type: geometry_msgs/msg/Twist}
proposed_topics:
  route_command: {name: /cmd_vel_ruta, type: geometry_msgs/msg/Twist}
  fuzzy_command: {name: /cmd_vel_difuso, type: geometry_msgs/msg/Twist}
  detected_station: {name: /estacion_detectada, type: std_msgs/msg/String}
  requested_destination: {name: /destino_solicitado, type: std_msgs/msg/String}
proposed_csv:
  header: [x_m, y_m]
  reference_frame: map
stations: [RECEPCION, ALMACENAMIENTO, EMPAQUE, DESPACHO]


# F0.4.3 - Contratos de diseno parcialmente implementados
# En F1 el supervisor consume /scan, /odom y /cmd_vel_ruta.
# No consume aun /rango_* ni /cmd_vel_difuso.
# La CNN y el arbitraje difuso completo siguen pendientes.
# Estos contratos requieren implementacion y validacion.
# Este archivo no se carga automaticamente como parametros ROS 2.

node_contracts:
  emulador_sensores:
    subscribes: [/scan]
    publishes: [/rango_frontal, /rango_izq, /rango_der]

  seguidor_ruta:
    subscribes: [/odom]
    publishes: [/cmd_vel_ruta]
    external_input: waypoints_csv

  controlador_difuso:
    subscribes: [/rango_frontal, /rango_izq, /rango_der]
    publishes: [/cmd_vel_difuso]

  reconocedor_estacion:
    subscribes: [/camera/image_raw]
    publishes: [/estacion_detectada]

  supervisor:
    subscribes:
      - /cmd_vel_ruta
      - /cmd_vel_difuso
      - /rango_frontal
      - /rango_izq
      - /rango_der
      - /estacion_detectada
      - /destino_solicitado
    publishes: [/cmd_vel]

control_policy:
  autonomous_command_publisher: supervisor
  candidate_topics: [/cmd_vel_ruta, /cmd_vel_difuso]
  output_topic: /cmd_vel
  simultaneous_manual_teleop: false
  velocity_limits_source: robot
  stop_on_invalid_inputs: true
  stop_command:
    linear_x: 0.0
    angular_z: 0.0

  # Pendientes de validacion:
  missing_data_timeout_s: null
  obstacle_threshold_m: null
  replanning_timeout_s: null

simulation_policy:
  use_sim_time_required: true
  robot_model: waffle_pi


# F0.4.5 - Decisiones de integracion
# Contratos de diseno; no son parametros ejecutables de ROS 2.

integration_decisions:
  destination_request:
    topic: /destino_solicitado
    type: std_msgs/msg/String
    producer: operator_interface
    valid_values:
      - RECEPCION
      - ALMACENAMIENTO
      - EMPAQUE
      - DESPACHO

  station_detection:
    topic: /estacion_detectada
    type: std_msgs/msg/String
    payload: station_identifier

  arbitration:
    controller: supervisor
    priority:
      - safe_stop
      - obstacle_avoidance
      - route_following
    switching_threshold_m: null

  waypoint_interface:
    format: csv
    header: [x_m, y_m]
    reference_frame: map
    coordinate_transform: static_identity_map_odom_sim

  safety_requirements:
    stop_on_missing_sensor_data: true
    stop_on_invalid_command: true
    allow_parallel_teleoperation: false
    sensor_timeout_s: null

  implementation_status: proposed
