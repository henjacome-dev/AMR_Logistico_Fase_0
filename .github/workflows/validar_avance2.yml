name: Validacion Avance 2
on:
  push:
    branches: [desarrollo-avance2]
  pull_request:
    branches: [main, desarrollo-avance2]
permissions:
  contents: read
jobs:
  validar-avance2:
    name: validar-avance2
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Validar FIS y evidencias publicadas
        run: python3 tools/verificar_publicacion_a2.py
      - name: Validar ZIP AC03 y manifiesto SHA256
        run: python3 tools/verificar_paquete_ac03.py
      - name: Preparar Python 3.10 para R18
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias R18
        run: python -m pip install -r tools/requirements_a2_r18.txt
      - name: Concordancia MATLAB-Python R18
        run: python tools/A2_E21_equivalencia_MATLAB_Python.py --worker
      - name: Autoprueba motor E2.2 (sin ROS ni Gazebo)
        run: python tools/A2_E22_nodo_difuso.py --self-test
      - name: Validar evidencia ROS E2.2 (ensayo realizado en Ubuntu)
        run: python tools/A2_E22_validar_evidencia.py
      - name: Autoprueba arbitraje E2.3.1 (sin ROS ni Gazebo)
        run: python tools/A2_E23_arbitraje_sombra.py --self-test
      - name: Validar evidencias E2.3.1-E2.3.3 (ensayos Ubuntu aislados)
        run: python tools/A2_E23_validar_evidencias.py
      - name: Validar evidencias Gazebo E2.3.4-E2.3.5 (modo sombra)
        run: python tools/A2_E2345_validar_evidencias_gazebo.py
